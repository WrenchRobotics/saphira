name: Saphirapy Unit Tests

on:
  push:
    paths:
      - 'src/python/saphirapy/**'
      - 'test/saphirapy/**'
      - 'test/data/**'
      - '.github/workflows/saphirapy-unit-tests.yml'
  pull_request:
    paths:
      - 'src/python/saphirapy/**'
      - 'test/saphirapy/**'
      - 'test/data/**'
      - '.github/workflows/saphirapy-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14.2'

jobs:
  unit-tests:
    name: Python 3.14.2
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/python/saphirapy/pyproject.toml

      - name: Install saphirapy and test runner
        run: python -m pip install --editable src/python/saphirapy pytest

      - name: Run unit tests
        run: python -m pytest test/saphirapy --verbose