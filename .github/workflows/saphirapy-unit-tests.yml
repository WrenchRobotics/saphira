name: Saphirapy Unit Tests

on:
  push:
    paths:
      - 'src/python/saphirapy/**'
      - 'test/saphirapy/**'
      - 'test/data/**'
      - '.github/workflows/saphirapy-unit-tests.yml'
  pull_request:
    paths:
      - 'src/python/saphirapy/**'
      - 'test/saphirapy/**'
      - 'test/data/**'
      - '.github/workflows/saphirapy-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Drake only publishes wheels for these versions.
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/python/saphirapy/pyproject.toml

      - name: Install saphirapy and test runner
        run: python -m pip install --editable src/python/saphirapy pytest

      - name: Run unit tests
        run: python -m pytest test/saphirapy --verbose