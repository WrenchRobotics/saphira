name: Test Action with a Brom Drake Grasping Production
on: [pull_request, deployment]

env:
  PYTHON_VERSION: '3.14.2'

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Prepare detection for grasping example
    permissions:
      contents: read
      pull-requests: write
    outputs:
      example-file: ${{ steps.detect.outputs.example-file }}
      detected-parent: ${{ steps.detect.outputs.detected-production-parent }}
      detected-production: ${{ steps.detect.outputs.detected-production }}
      alternative-productions-json: ${{ steps.detect.outputs.alternative-productions-json }}
      alternative-actors-json: ${{ steps.detect.outputs.alternative-actors-json }}
      has-alternative-productions: ${{ steps.detect.outputs.has-alternative-productions }}
      has-alternative-actors: ${{ steps.detect.outputs.has-alternative-actors }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect related productions
        id: detect
        uses: ./.github/actions/saphira-detect
        with:
          path-to-example-run: src/examples/grasping1/
          python-version: ${{ env.PYTHON_VERSION }}

  run-baseline:
    needs: prepare
    runs-on: ubuntu-latest
    name: Run current production with current actors
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run and evaluate baseline
        id: run-evaluate
        uses: ./.github/actions/saphira-run-evaluate
        with:
          target-file: ${{ needs.prepare.outputs.example-file }}
          production-class: ${{ needs.prepare.outputs.detected-production }}
          variant-name: baseline-${{ needs.prepare.outputs.detected-production }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upload baseline result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-result
          path: |
            ${{ steps.run-evaluate.outputs.result-json-path }}
            ${{ steps.run-evaluate.outputs.restaging-bundle-path }}

  run-alternative-productions:
    needs: prepare
    if: needs.prepare.outputs.has-alternative-productions == 'true'
    runs-on: ubuntu-latest
    name: Run alternative productions with current actors
    strategy:
      fail-fast: false
      matrix:
        production: ${{ fromJSON(needs.prepare.outputs.alternative-productions-json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run and evaluate production variant
        id: run-evaluate
        uses: ./.github/actions/saphira-run-evaluate
        with:
          target-file: ${{ needs.prepare.outputs.example-file }}
          production-class: ${{ matrix.production }}
          variant-name: production-${{ matrix.production }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upload matrix result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-result-${{ matrix.production }}
          path: |
            ${{ steps.run-evaluate.outputs.result-json-path }}
            ${{ steps.run-evaluate.outputs.restaging-bundle-path }}

  run-alternative-actors:
    needs: prepare
    if: needs.prepare.outputs.has-alternative-actors == 'true'
    runs-on: ubuntu-latest
    name: Run current production with alternative actors
    strategy:
      fail-fast: false
      matrix:
        actor: ${{ fromJSON(needs.prepare.outputs.alternative-actors-json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run and evaluate actor variant
        id: run-evaluate
        uses: ./.github/actions/saphira-run-evaluate
        with:
          target-file: ${{ needs.prepare.outputs.example-file }}
          production-class: ${{ needs.prepare.outputs.detected-production }}
          actor-variant-json: ${{ toJSON(matrix.actor) }}
          variant-name: actor-${{ matrix.actor.name }}-${{ matrix.actor.cast_call_index }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upload actor result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actor-result-${{ matrix.actor.name }}-${{ matrix.actor.cast_call_index }}
          path: |
            ${{ steps.run-evaluate.outputs.result-json-path }}
            ${{ steps.run-evaluate.outputs.restaging-bundle-path }}

  summarize:
    needs: [prepare, run-baseline, run-alternative-productions, run-alternative-actors]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download result artifacts
        uses: actions/download-artifact@v4
        with:
          path: productions/matrix-results

      - name: Collate results and comment on PR
        uses: ./.github/actions/saphira-collate-comment
        with:
          results-directories: productions/matrix-results
          section-key: test-grasping-summary
          section-heading: Grasping Example Summary
          python-version: ${{ env.PYTHON_VERSION }}
          detected-parent: ${{ needs.prepare.outputs.detected-parent }}
          allow-comment-update: >-
            ${{
              needs.prepare.result == 'success' &&
              needs.run-baseline.result == 'success' &&
              (needs.prepare.outputs.has-alternative-productions != 'true' || needs.run-alternative-productions.result == 'success') &&
              (needs.prepare.outputs.has-alternative-actors != 'true' || needs.run-alternative-actors.result == 'success')
            }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
