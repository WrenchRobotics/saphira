name: Saphira Facade Local Run

on: [pull_request, deployment]

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: '3.14.2'

jobs:
  run-facade:
    runs-on: ubuntu-latest
    name: Run local-only Saphira facade
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run facade with local fanout
        uses: ./.github/actions/saphira-run
        with:
          path-to-example-run: src/examples/motion_planning1/chem.py
          fanout-source: local
          include-alternative-actors: 'true'
          max-concurrency: '2'
          run-timeout-seconds: '300'
          python-version: ${{ env.PYTHON_VERSION }}
          section-key: saphira-facade-local
          section-heading: Saphira Facade Local Results
          github-token: ${{ secrets.GITHUB_TOKEN }}