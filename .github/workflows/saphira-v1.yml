name: Saphira v1 Metrics Comment Test

on: [pull_request, deployment]

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: '3.14'

jobs:
  run-facade:
    runs-on: ubuntu-latest
    name: Run Saphira v1 facade
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Saphira v1 fanout
        uses: ./.github/actions/saphira-run
        with:
          path-to-example-run: src/examples/motion_planning1/chem.py
          fanout-source: local
          include-alternative-actors: 'true'
          max-concurrency: '2'
          run-timeout-seconds: '300'
          python-version: ${{ env.PYTHON_VERSION }}
          section-key: saphira-v1-matrix
          section-heading: Saphira v1 Matrix Results
          github-token: ${{ secrets.GITHUB_TOKEN }}
