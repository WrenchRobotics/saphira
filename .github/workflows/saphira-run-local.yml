name: Saphira Run (Local)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Lets saphira-run prove which repository and run it reports from.
  id-token: write
  # Only for the workflow's own PR comment, the fallback when the app cannot post (fork PRs).
  pull-requests: write

env:
  PYTHON_VERSION: '3.14'

jobs:
  saphira-run:
    runs-on: ubuntu-latest
    name: Run Saphira with local fanout (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Motion Planning
            path-to-example-run: src/examples/motion_planning1/chem.py
          - name: Grasping
            path-to-example-run: src/examples/grasping1/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Saphira with local fanout
        uses: ./.github/actions/saphira-run
        with:
          path-to-example-run: ${{ matrix.path-to-example-run }}
          fanout-source: local
          # Wrench Saphira [Staging] is installed on this repository, so it posts these results.
          api-url: https://api-staging.wrenchrobotics.com
          api-key: ${{ secrets.WRENCH_SAPHIRA_STAGING_API_KEY }}
          # The app must post the results, except on fork PRs, which get no secrets or OIDC token
          # and fall back to the workflow's own comment.
          report-mode: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'auto' || 'app' }}
          kinds: productions,casts
          max-concurrency: '2'
          run-timeout-seconds: '300'
          python-version: ${{ env.PYTHON_VERSION }}
          name: Local ${{ matrix.name }}
