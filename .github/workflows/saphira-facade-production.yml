name: Saphira Facade Production Run

# Integration check against the production backend. Advisory: a failure can come from saphira,
# the backend, or production being down, so this should not be a required check.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Sends a GitHub Actions OIDC token with the fanout request and the report, as keys tied to
  # this repository and the reports endpoint require.
  id-token: write
  # Only for the workflow's own PR comment, the fallback when the app cannot post.
  pull-requests: write

env:
  PYTHON_VERSION: '3.14'
  API_BASE: https://api.wrenchrobotics.com

jobs:
  run-facade:
    # Fork PRs do not receive secrets, so only run PRs opened from this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Run Saphira facade with production fanout
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check production backend health
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 10 "$API_BASE/healthz"

      - name: Run facade with remote fanout
        uses: ./.github/actions/saphira-run
        with:
          path-to-example-run: src/examples/motion_planning1/chem.py
          # No fallback: an unreachable production backend should fail this check, not pass as a local run.
          fanout-source: remote
          api-url: ${{ env.API_BASE }}
          api-key: ${{ secrets.WRENCH_SAPHIRA_API_KEY }}
          include-alternative-actors: 'true'
          max-concurrency: '2'
          run-timeout-seconds: '300'
          python-version: ${{ env.PYTHON_VERSION }}
          artifact-name: saphira-facade-production
          section-key: saphira-facade-production
          section-heading: Saphira Facade Production Results
