name: Move Major Version Tag

# Users reference the actions by major version, as in saphira-run@v0. GitHub does not resolve
# versions: v0 is an ordinary tag, so this workflow moves it to each new v0.x.y release. Releasing
# is then only pushing an immutable vX.Y.Z tag from main.

on:
  push:
    # Releases only: pre-release tags such as v0.2.0-rc.1 do not match, so they never move v0.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  # Pushes the moved major tag.
  contents: write

concurrency:
  group: move-major-tag
  cancel-in-progress: false

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # All tags, to find the newest release, and main, to check the tag is on it.
          fetch-depth: 0

      - name: Move the major tag to this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          major="${TAG%%.*}"

          # Everyone on the major tag gets this commit, so it must have been merged to main.
          commit="$(git rev-parse "${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$TAG points to ${commit:0:7}, which is not on main. Tag a commit on main instead."
            exit 1
          fi

          # Only the newest release of a major version moves its tag, so a release to an older
          # minor version does not take users on the major tag backwards. Tags off main were
          # refused above, so they do not count.
          latest="$(git tag --merged origin/main --list "${major}.*" | grep -E "^${major}\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)"
          if [ "$latest" != "$TAG" ]; then
            echo "::notice::$TAG is not the newest $major release ($latest is), so $major stays where it is."
            exit 0
          fi

          git tag --force "$major" "$commit"
          git push --force origin "refs/tags/$major"
          echo "Moved \`$major\` to \`$TAG\` (\`${commit:0:7}\`)." >> "$GITHUB_STEP_SUMMARY"
