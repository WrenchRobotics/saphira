name: Saphira Collate and Comment

description: Collate multiple saphira-run-evaluate result JSON files into a single combined PR comment.

inputs:
  results-directories:
    description: Newline-separated directories containing per-run result JSON files (searched recursively).
    required: true
  python-version:
    description: Python version to use.
    required: false
    default: '3.14'
  detected-parent:
    description: Detected parent production class name, for context in the comment.
    required: false
    default: ''
  comment-marker:
    description: Hidden HTML marker used to find and update the existing comment.
    required: false
    default: '<!-- saphira-combined-metrics-comment -->'
  section-key:
    description: Optional stable key used to upsert a single section inside the shared PR comment.
    required: false
    default: ''
  section-heading:
    description: Optional section heading to render for this collate invocation.
    required: false
    default: ''
  github-token:
    description: Token used to create or update the PR comment.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      id: install
      shell: bash
      run: |
        set -euo pipefail
        pip install brom_drake
        # Install from this action's own checkout so the action works from any repository.
        pip install "$GITHUB_ACTION_PATH/../../../src/python/saphirapy"
        echo "action-path=$GITHUB_ACTION_PATH" >> "$GITHUB_OUTPUT"

    - name: Build combined summary
      id: combined-summary
      shell: bash
      run: |
        set -euo pipefail
        summary="$(RESULTS_DIRECTORIES='${{ inputs.results-directories }}' python "$GITHUB_ACTION_PATH/collate_results.py")"

        {
          echo "summary<<EOF"
          printf '%s\n' "$summary"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Upsert combined PR comment
      if: ${{ github.event_name == 'pull_request' }}
      # Fork PRs get a read-only token; the results are still in the uploaded artifacts.
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        COMMENT_MARKER: ${{ inputs.comment-marker }}
        DETECTED_PARENT: ${{ inputs.detected-parent }}
        SECTION_KEY: ${{ inputs.section-key }}
        SECTION_HEADING: ${{ inputs.section-heading }}
        RESULTS_DIRECTORIES: ${{ inputs.results-directories }}
        COMBINED_SUMMARY: ${{ steps.combined-summary.outputs.summary }}
        UPSERT_SCRIPT: ${{ steps.install.outputs.action-path }}/upsert_comment.js
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          await require(process.env.UPSERT_SCRIPT)({ github, context, core });
