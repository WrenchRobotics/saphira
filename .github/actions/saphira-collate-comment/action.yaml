name: Saphira Collate and Comment

description: Collate multiple saphira-run-evaluate result JSON files into a single combined PR comment.

inputs:
  results-directory:
    description: Directory containing per-run result JSON files (searched recursively).
    required: true
  detected-parent:
    description: Detected parent production class name, for context in the comment.
    required: false
    default: ''
  comment-marker:
    description: Hidden HTML marker used to find and update the existing comment.
    required: false
    default: '<!-- saphira-combined-metrics-comment -->'
  github-token:
    description: Token used to create or update the PR comment.
    required: true

runs:
  using: composite
  steps:
    - name: Build combined summary
      id: combined-summary
      shell: bash
      run: |
        set -euo pipefail
        results_dir="${{ inputs.results-directory }}"
        summary="### Combined Saphira Metrics"

        result_files=()
        if [ -d "$results_dir" ]; then
          while IFS= read -r file; do
            result_files+=("$file")
          done < <(find "$results_dir" -type f -name "*.json" | sort)
        fi

        if [ "${#result_files[@]}" -eq 0 ]; then
          summary="$summary\n- No run-evaluate result files were found"
        else
          pass_count=0
          fail_count=0
          parse_error_count=0
          for file in "${result_files[@]}"; do
            parsed="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print((d.get("production_class") or "unknown")+"\t"+str(d.get("exit_code","unknown")))' "$file" 2>/dev/null || true)"

            if [ -z "$parsed" ]; then
              prod="$(basename "$file" .json)"
              code="parse_error"
              status="failed"
              fail_count=$((fail_count + 1))
              parse_error_count=$((parse_error_count + 1))
            else
              prod="${parsed%%$'\t'*}"
              code="${parsed#*$'\t'}"
              if [ "$code" = "0" ]; then
                status="passed"
                pass_count=$((pass_count + 1))
              else
                status="failed"
                fail_count=$((fail_count + 1))
              fi
            fi

            summary="$summary\n- $prod: $status (exit_code=$code)"
          done

          summary="$summary\n\nTotals: $pass_count passed, $fail_count failed"
          if [ "$parse_error_count" -gt 0 ]; then
            summary="$summary\n- Warning: $parse_error_count result file(s) could not be parsed"
          fi
        fi

        {
          echo "summary<<EOF"
          printf '%b\n' "$summary"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Upsert combined PR comment
      if: ${{ always() && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const marker = `${{ inputs.comment-marker }}`;
          const detectedParent = `${{ inputs.detected-parent }}`;
          const combinedSummary = `${{ steps.combined-summary.outputs.summary }}` || '### Combined Saphira Metrics\n- Summary generation failed';
          const commitSuffix = context.sha.slice(-7);
          const runAttempt = process.env.GITHUB_RUN_ATTEMPT || '1';

          const body = [
            marker,
            'Saphira combined run complete.',
            detectedParent ? `Detected production parent: ${detectedParent}` : '',
            `Trigger commit suffix: ${commitSuffix} (run attempt ${runAttempt})`,
            '',
            combinedSummary,
          ].filter((line) => line !== null && line !== '').join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            per_page: 100,
          });

          const existing = comments.find((c) =>
            typeof c.body === 'string' && c.body.includes(marker)
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
          }
