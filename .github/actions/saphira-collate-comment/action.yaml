name: Saphira Collate and Comment

description: Collate multiple saphira-run-evaluate result JSON files into a single combined PR comment.

inputs:
  results-directories:
    description: Newline-separated directories containing per-run result JSON files (searched recursively).
    required: true
  python_version:
    description: Python version to use.
    required: false
    default: '3.14.2'
  detected-parent:
    description: Detected parent production class name, for context in the comment.
    required: false
    default: ''
  allow-comment-update:
    description: Whether this action should build and upsert a PR comment for the current run.
    required: false
    default: 'true'
  comment-marker:
    description: Hidden HTML marker used to find and update the existing comment.
    required: false
    default: '<!-- saphira-combined-metrics-comment -->'
  github-token:
    description: Token used to create or update the PR comment.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      if: ${{ inputs.allow-comment-update == 'true' }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install dependencies
      if: ${{ inputs.allow-comment-update == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        pip install brom_drake
        pip install -e src/python/saphirapy

    - name: Build combined summary
      id: combined-summary
      if: ${{ inputs.allow-comment-update == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        summary="$(RESULTS_DIRECTORIES='${{ inputs.results-directories }}' python .github/actions/saphira-collate-comment/collate_results.py)"

        {
          echo "summary<<EOF"
          printf '%s\n' "$summary"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Upsert combined PR comment
      if: ${{ inputs.allow-comment-update == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        COMMENT_MARKER: ${{ inputs.comment-marker }}
        DETECTED_PARENT: ${{ inputs.detected-parent }}
        COMBINED_SUMMARY: ${{ steps.combined-summary.outputs.summary }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const marker = process.env.COMMENT_MARKER || '<!-- saphira-combined-metrics-comment -->';
          const detectedParent = process.env.DETECTED_PARENT || '';
          const combinedSummary = process.env.COMBINED_SUMMARY || '### Combined Saphira Metrics\n- Summary generation failed';
          const commitSuffix = context.sha.slice(-7);
          const runAttempt = process.env.GITHUB_RUN_ATTEMPT || '1';

          const body = [
            marker,
            'Saphira combined run complete.',
            detectedParent ? `Detected production parent: ${detectedParent}` : '',
            `Trigger commit suffix: ${commitSuffix} (run attempt ${runAttempt})`,
            '',
            combinedSummary,
          ].filter((line) => line !== null && line !== '').join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            per_page: 100,
          });

          const existing = comments.find((c) =>
            typeof c.body === 'string' && c.body.includes(marker)
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
          }
