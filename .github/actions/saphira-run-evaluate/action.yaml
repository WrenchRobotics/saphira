name: Saphira Run and Evaluate

description: Restage and run a single cast production, then emit metrics for that run.

inputs:
  target-file:
    description: Path to the source example Python file to restage.
    required: true
  production-class:
    description: Production class name to restage into the target file.
    required: true
  actor-variant-json:
    description: JSON definition of one replacement actor variant.
    required: false
    default: ''
  cast-production-name:
    description: Unique name used for the restaged file and result artifact.
    required: false
    default: ''
  python-version:
    description: Python version to use.
    required: false
    default: '3.14.2'
  restaged-output-directory:
    description: Directory where restaged files are written.
    required: false
    default: productions/restaged
  result-directory:
    description: Directory where per-run result json is written.
    required: false
    default: productions/matrix-results

outputs:
  result-json-path:
    description: Path to the generated result JSON for this run.
    value: ${{ steps.run-production.outputs.result-json-path }}
  restaging-bundle-path:
    description: Directory containing the generated Python file and YAML restaging manifest.
    value: ${{ steps.run-production.outputs.restaging-bundle-path }}
  exit-code:
    description: Exit code from running the restaged production.
    value: ${{ steps.run-production.outputs.exit-code }}
  metrics-markdown:
    description: Markdown summary for this run.
    value: ${{ steps.run-production.outputs.metrics-markdown }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        pip install brom_drake
        pip install -e src/python/saphirapy

    - name: Restage and run production
      id: run-production
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${{ inputs.result-directory }}"
        cast_production_name="${{ inputs.cast-production-name }}"
        if [ -z "$cast_production_name" ]; then
          cast_production_name="${{ inputs.production-class }}"
        fi
        result_json_path="${{ inputs.result-directory }}/$cast_production_name.json"

        start_epoch="$(python -c 'import time; print(time.time())')"

        set +e
        actor_arguments=()
        if [ -n "$ACTOR_VARIANT_JSON" ]; then
          actor_arguments+=(--actor-variant-json "$ACTOR_VARIANT_JSON")
        fi
        saphira-restage-and-run-production \
          --target-file "${{ inputs.target-file }}" \
          --production-class "${{ inputs.production-class }}" \
          --output-dir "${{ inputs.restaged-output-directory }}" \
          --result-json "$result_json_path" \
          --cast-production-name "$cast_production_name" \
          "${actor_arguments[@]}"
        exit_code=$?
        set -e

        end_epoch="$(python -c 'import time; print(time.time())')"
        duration_seconds="$(python -c "start=float('$start_epoch'); end=float('$end_epoch'); print(f'{max(0.0, end-start):.3f}')")"

        python .github/actions/saphira-run-evaluate/finalize_result.py \
          "$result_json_path" \
          "${{ inputs.production-class }}" \
          "$exit_code" \
          "$duration_seconds" \
          "" \
          "$cast_production_name"

        metrics_body="### Cast Production Metrics\n- Cast Production: $cast_production_name\n- Production class: ${{ inputs.production-class }}\n- Exit code: $exit_code\n- Duration (s): $duration_seconds"

        echo "result-json-path=$result_json_path" >> "$GITHUB_OUTPUT"
        echo "restaging-bundle-path=${{ inputs.restaged-output-directory }}" >> "$GITHUB_OUTPUT"
        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"
        {
          echo "metrics-markdown<<EOF"
          printf '%b\n' "$metrics_body"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
      env:
        ACTOR_VARIANT_JSON: ${{ inputs.actor-variant-json }}
