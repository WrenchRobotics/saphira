name: Saphira Detect

description: Detect the production parent and related production classes for a target example.

inputs:
  path-to-example-run:
    description: Path to the example directory containing a production script.
    required: true
  python-version:
    description: Python version to use.
    required: false
    default: '3.14.2'
  include-alternative-productions:
    description: Generate matrix entries for other production classes in the same family.
    required: false
    default: 'true'
  include-alternative-actors:
    description: Generate matrix entries for registered replacement actors on the detected production.
    required: false
    default: 'false'

outputs:
  example-file:
    description: The selected example Python file used for detection.
    value: ${{ steps.locate-example.outputs.example-file }}
  detected-production-parent:
    description: Detected parent production class name from RELATED_PRODUCTIONS.
    value: ${{ steps.detect-production-map.outputs.detected-parent }}
  detected-production:
    description: Detected concrete production class name.
    value: ${{ steps.detect-production-map.outputs.detected-production }}
  related-productions-json:
    description: JSON array of related production class names.
    value: ${{ steps.detect-production-map.outputs.related-productions-json }}
  alternative-productions-json:
    description: JSON array of production alternatives excluding the detected production.
    value: ${{ steps.detect-production-map.outputs.alternative-productions-json }}
  alternative-actors-json:
    description: JSON array of registered actor-replacement variants.
    value: ${{ steps.detect-production-map.outputs.alternative-actors-json }}
  has-alternative-productions:
    description: Whether at least one production alternative was selected.
    value: ${{ steps.detect-production-map.outputs.has-alternative-productions }}
  has-alternative-actors:
    description: Whether at least one actor alternative was selected.
    value: ${{ steps.detect-production-map.outputs.has-alternative-actors }}
  casted-productions-json:
    description: JSON array of matrix-ready casted productions ({production-class, actor-variant-json, casted-production-name, artifact-name}) combining related productions and, when enabled, alternative actors.
    value: ${{ steps.detect-production-map.outputs.casted-productions-json }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        pip install brom_drake
        pip install -e src/python/saphirapy

    - name: Locate the example run
      id: locate-example
      shell: bash
      run: |
        set -euo pipefail
        echo "The example run is located at ${{ inputs.path-to-example-run }}"
        matching_files=()
        while read -r file; do
          echo "Found Python file: $file"
          if grep -q "brom_drake.productions" "$file"; then
            matching_files+=("$file")
          fi
        done < <(find ${{ inputs.path-to-example-run }} -type f -name "*.py")

        if [ "${#matching_files[@]}" -eq 0 ]; then
          echo "No matching production file was found in ${{ inputs.path-to-example-run }}"
          exit 1
        fi

        first_file="${matching_files[0]}"
        echo "Using example file: $first_file"
        echo "example-file=$first_file" >> "$GITHUB_OUTPUT"

    - name: Detect production mapping
      id: detect-production-map
      shell: bash
      run: |
        set -euo pipefail
        detection_json="$(saphira-detect-production-map "${{ steps.locate-example.outputs.example-file }}")"
        echo "Detection payload: $detection_json"
        python .github/actions/saphira-detect/emit_outputs.py \
          "$detection_json" \
          "${{ steps.locate-example.outputs.example-file }}" \
          "$GITHUB_OUTPUT" \
          "${{ inputs.include-alternative-productions }}" \
          "${{ inputs.include-alternative-actors }}"
