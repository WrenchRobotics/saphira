name: Saphira Run

description: Detect, optionally augment, execute, and summarize a Saphira fanout.

inputs:
  path-to-example-run:
    description: Example Python file or directory containing a production script.
    required: true
  fanout-source:
    description: >-
      local, remote, or remote-with-fallback. The default falls back to local cases when no token
      is set or the service is unavailable.
    required: false
    default: remote-with-fallback
  api-url:
    description: >-
      The Wrench API, for fanout and reports. Use https://api-staging.wrenchrobotics.com for
      staging; results are then posted by Wrench Saphira [Staging].
    required: false
    default: https://api.wrenchrobotics.com
  api-key:
    description: Wrench API key for fanout and reports, e.g. secrets.WRENCH_SAPHIRA_API_KEY.
    required: false
  report-mode:
    description: >-
      auto, app, workflow, or none. auto submits the results to the Wrench API, which posts them
      as the Saphira GitHub App, and falls back to the workflow's own PR comment when it cannot.
      app fails instead of falling back, workflow only posts the workflow's comment, and none
      only writes the job summary.
    required: false
    default: auto
  kinds:
    description: >-
      Comma-separated case kinds to run besides the baseline: productions (related productions)
      and casts (alternative actors). Empty runs productions locally and requests every kind the
      key permits from the Wrench API.
    required: false
    default: ''
  fanout-timeout-seconds:
    description: Timeout for the remote fanout request.
    required: false
    default: '10'
  max-concurrency:
    required: false
    default: ''
  run-timeout-seconds:
    required: false
    default: '900'
  progress:
    description: 'Progress mode: auto, bar, lines, or none.'
    required: false
    default: auto
  python-version:
    required: false
    default: '3.14'
  results-directory:
    required: false
    default: productions/facade-results
  restaged-output-directory:
    required: false
    default: productions/facade-restaged
  artifact-name:
    description: Name of the uploaded results artifact; must be unique within a workflow run.
    required: false
    default: saphira-facade-results
  section-key:
    required: false
    default: saphira-facade
  section-heading:
    required: false
    default: Saphira Facade Results
  github-token:
    description: Token for the workflow's own PR comment, used only when the app does not post.
    required: false
    default: ${{ github.token }}

outputs:
  detected-parent:
    value: ${{ steps.run-facade.outputs.detected-parent }}
  fanout-source:
    value: ${{ steps.run-facade.outputs.fanout-source }}
  remote-status:
    value: ${{ steps.run-facade.outputs.remote-status }}
  oidc-status:
    description: sent, unavailable, failed, or not-requested.
    value: ${{ steps.run-facade.outputs.oidc-status }}
  fanout-request-id:
    description: The Wrench API's ID for the fanout request, empty without remote fanout.
    value: ${{ steps.run-facade.outputs.fanout-request-id }}
  remote-case-count:
    description: How many of the cases that ran came from remote fanout.
    value: ${{ steps.run-facade.outputs.remote-case-count }}
  report-status:
    description: posted, fallback, workflow, skipped, or failed.
    value: ${{ steps.submit.outputs.report-status }}
  report-url:
    description: The PR comment, or for other events the Check, posted by the Saphira GitHub App.
    value: ${{ steps.submit.outputs.report-url }}
  result-count:
    value: ${{ steps.run-facade.outputs.result-count }}
  failed-count:
    description: Cases that failed the run. Cases that timed out are not counted.
    value: ${{ steps.run-facade.outputs.failed-count }}
  timed-out-count:
    description: Cases that timed out. They are reported but do not fail the run.
    value: ${{ steps.run-facade.outputs.timed-out-count }}
  results-directory:
    value: ${{ steps.run-facade.outputs.results-directory }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      id: install
      shell: bash
      run: |
        set -euo pipefail
        pip install brom_drake
        # Install from this action's own checkout so the action works from any repository.
        pip install "$GITHUB_ACTION_PATH/../../../src/python/saphirapy"
        echo "collate-path=$GITHUB_ACTION_PATH/../saphira-collate-comment" >> "$GITHUB_OUTPUT"

    - name: Run Saphira facade
      id: run-facade
      shell: bash
      continue-on-error: true
      env:
        WRENCH_API_KEY: ${{ inputs.api-key }}
        KINDS: ${{ inputs.kinds }}
      run: |
        set -euo pipefail
        args=(
          --path-to-example-run "${{ inputs.path-to-example-run }}"
          --api-url "${{ inputs.api-url }}"
          --fanout-source "${{ inputs.fanout-source }}"
          --fanout-timeout-seconds "${{ inputs.fanout-timeout-seconds }}"
          --run-timeout-seconds "${{ inputs.run-timeout-seconds }}"
          --progress "${{ inputs.progress }}"
          --result-directory "${{ inputs.results-directory }}"
          --restaged-output-directory "${{ inputs.restaged-output-directory }}"
        )
        # The key reaches the facade through WRENCH_API_KEY only, never the command line.
        if [ -n "$KINDS" ]; then args+=(--kinds "$KINDS"); fi
        if [ -n "${{ inputs.max-concurrency }}" ]; then args+=(--max-concurrency "${{ inputs.max-concurrency }}"); fi
        saphira-run-facade "${args[@]}"

    - name: Upload facade artifacts
      id: upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.results-directory }}
          ${{ inputs.restaged-output-directory }}

    # A local `uses: ./.github/actions/...` would resolve against the caller's repository, so the
    # collate scripts are called from this action's checkout instead.
    - name: Collate facade results
      id: collate
      if: always()
      shell: bash
      env:
        RESULTS_DIRECTORIES: ${{ inputs.results-directory }}
        COLLATE_PATH: ${{ steps.install.outputs.collate-path }}
      run: |
        set -euo pipefail
        summary="$(python "$COLLATE_PATH/collate_results.py")"

        {
          echo "summary<<EOF"
          printf '%s\n' "$summary"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        printf '%s\n\n' "$summary" >> "$GITHUB_STEP_SUMMARY"

    # The key reaches saphira-submit through WRENCH_API_KEY only, never the command line. The
    # other values come through the environment too, so nothing is interpolated into the script.
    - name: Submit Saphira report
      id: submit
      if: always()
      shell: bash
      env:
        WRENCH_API_KEY: ${{ inputs.api-key }}
        RESULTS_DIRECTORY: ${{ inputs.results-directory }}
        REPORT_MODE: ${{ inputs.report-mode }}
        API_URL: ${{ inputs.api-url }}
        SECTION_KEY: ${{ inputs.section-key }}
        SECTION_HEADING: ${{ inputs.section-heading }}
        DETECTED_PARENT: ${{ steps.run-facade.outputs.detected-parent }}
        DETECTED_PRODUCTION: ${{ steps.run-facade.outputs.detected-production }}
        FANOUT_SOURCE: ${{ steps.run-facade.outputs.fanout-source }}
        REMOTE_STATUS: ${{ steps.run-facade.outputs.remote-status }}
        FANOUT_REQUEST_ID: ${{ steps.run-facade.outputs.fanout-request-id }}
        ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        set -euo pipefail
        saphira-submit \
          --results-directories "$RESULTS_DIRECTORY" \
          --report-mode "$REPORT_MODE" \
          --api-url "$API_URL" \
          --section-key "$SECTION_KEY" \
          --section-heading "$SECTION_HEADING" \
          --detected-parent "$DETECTED_PARENT" \
          --detected-production "$DETECTED_PRODUCTION" \
          --fanout-source "$FANOUT_SOURCE" \
          --remote-status "$REMOTE_STATUS" \
          --fanout-request-id "$FANOUT_REQUEST_ID" \
          --artifact-id "$ARTIFACT_ID" \
          --artifact-name "$ARTIFACT_NAME"

    - name: Upsert facade PR comment
      if: ${{ always() && github.event_name == 'pull_request' && steps.submit.outputs.workflow-comment == 'true' }}
      # Fork PRs get a read-only token; the results are still in the uploaded artifacts.
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        DETECTED_PARENT: ${{ steps.run-facade.outputs.detected-parent }}
        SECTION_KEY: ${{ inputs.section-key }}
        SECTION_HEADING: ${{ inputs.section-heading }}
        RESULTS_DIRECTORIES: ${{ inputs.results-directory }}
        COMBINED_SUMMARY: ${{ steps.collate.outputs.summary }}
        UPSERT_SCRIPT: ${{ steps.install.outputs.collate-path }}/upsert_comment.js
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          await require(process.env.UPSERT_SCRIPT)({ github, context, core });

    - name: Check facade results
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        outcome="${{ steps.run-facade.outcome }}"
        failed_count="${{ steps.run-facade.outputs.failed-count }}"
        timed_out_count="${{ steps.run-facade.outputs.timed-out-count }}"
        result_count="${{ steps.run-facade.outputs.result-count }}"
        if [ -n "$timed_out_count" ] && [ "$timed_out_count" != '0' ]; then
          echo "::notice::${timed_out_count}/${result_count} Saphira fanout cases timed out. Timeouts are reported but do not fail this check."
        fi
        if [ "$outcome" != 'success' ] && [ -z "$failed_count" ]; then
          echo "::error::Saphira facade run did not produce results (fanout crashed before reporting outputs)."
          exit 1
        fi
        if [ -n "$failed_count" ] && [ "$failed_count" != '0' ]; then
          echo "::error::${failed_count}/${result_count} Saphira fanout cases failed. See the uploaded artifacts and the PR comment or Check for details."
          exit 1
        fi