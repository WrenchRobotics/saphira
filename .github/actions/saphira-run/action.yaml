name: Saphira Run

description: Detect, optionally augment, execute, and summarize a Saphira fanout.

inputs:
  path-to-example-run:
    description: Example Python file or directory containing a production script.
    required: true
  fanout-source:
    description: >-
      local, remote, or remote-with-fallback. The default falls back to local cases when no token
      is set or the service is unavailable.
    required: false
    default: remote-with-fallback
  api-url:
    description: >-
      The Wrench API, for fanout and reports. Use https://api-staging.wrenchrobotics.com for
      staging; results are then posted by Wrench Saphira [Staging].
    required: false
    default: https://api.wrenchrobotics.com
  api-key:
    description: Wrench API key for fanout and reports, e.g. secrets.WRENCH_SAPHIRA_API_KEY.
    required: false
  report-mode:
    description: >-
      auto, app, or none. auto submits the results to the Wrench API, which posts them as the
      Saphira GitHub App, and falls back to the workflow's own PR comment when it cannot. app
      fails instead of falling back, and none only writes the job summary.
    required: false
    default: auto
  kinds:
    description: >-
      Comma-separated case kinds to run besides the baseline: productions (related productions)
      and casts (alternative actors). Empty runs productions locally and requests every kind the
      key permits from the Wrench API.
    required: false
    default: ''
  max-concurrency:
    required: false
    default: ''
  run-timeout-seconds:
    required: false
    default: '900'
  python-version:
    description: Must be 3.14, the only version that both brom_drake 1.x and Drake support.
    required: false
    default: '3.14'
  name:
    description: >-
      Names these results, such as Motion Planning. Each saphira-run in a workflow run needs its
      own. The heading becomes 'Saphira Results (Motion Planning)', and the artifact
      saphira-results-motion-planning. Empty gives 'Saphira Results' and saphira-results.
    required: false
    default: ''
  github-token:
    description: Token for the workflow's own PR comment, used only when the app does not post.
    required: false
    default: ${{ github.token }}

outputs:
  detected-parent:
    value: ${{ steps.run-facade.outputs.detected-parent }}
  fanout-source:
    value: ${{ steps.run-facade.outputs.fanout-source }}
  remote-status:
    value: ${{ steps.run-facade.outputs.remote-status }}
  oidc-status:
    description: sent, unavailable, failed, or not-requested.
    value: ${{ steps.run-facade.outputs.oidc-status }}
  fanout-request-id:
    description: The Wrench API's ID for the fanout request, empty without remote fanout.
    value: ${{ steps.run-facade.outputs.fanout-request-id }}
  remote-case-count:
    description: How many of the cases that ran came from remote fanout.
    value: ${{ steps.run-facade.outputs.remote-case-count }}
  report-status:
    description: posted, fallback, skipped, or failed.
    value: ${{ steps.submit.outputs.report-status }}
  report-url:
    description: The PR comment, or for other events the Check, posted by the Saphira GitHub App.
    value: ${{ steps.submit.outputs.report-url }}
  result-count:
    value: ${{ steps.run-facade.outputs.result-count }}
  failed-count:
    description: Cases that failed the run. Cases that timed out are not counted.
    value: ${{ steps.run-facade.outputs.failed-count }}
  timed-out-count:
    description: Cases that timed out. They are reported but do not fail the run.
    value: ${{ steps.run-facade.outputs.timed-out-count }}
  results-directory:
    description: Where the result JSON files are, for later steps that read them.
    value: ${{ steps.names.outputs.results-directory }}
  restaged-directory:
    description: Where the restaged production files are.
    value: ${{ steps.names.outputs.restaged-directory }}

runs:
  using: composite
  steps:
    # Fail before setup, rather than after the fanout, when an input is misspelled.
    - name: Check inputs
      shell: bash
      env:
        FANOUT_SOURCE: ${{ inputs.fanout-source }}
        REPORT_MODE: ${{ inputs.report-mode }}
        KINDS: ${{ inputs.kinds }}
        PYTHON_VERSION: ${{ inputs.python-version }}
        RUN_TIMEOUT_SECONDS: ${{ inputs.run-timeout-seconds }}
        MAX_CONCURRENCY: ${{ inputs.max-concurrency }}
        API_URL: ${{ inputs.api-url }}
      run: |
        set -euo pipefail
        failed=0
        refuse() { echo "::error title=Saphira input::$1"; failed=1; }
        case "$FANOUT_SOURCE" in
          local|remote|remote-with-fallback) ;;
          *) refuse "fanout-source must be local, remote, or remote-with-fallback, not '$FANOUT_SOURCE'." ;;
        esac
        case "$REPORT_MODE" in
          auto|app|none) ;;
          *) refuse "report-mode must be auto, app, or none, not '$REPORT_MODE'." ;;
        esac
        IFS=',' read -ra kinds <<< "$KINDS"
        for kind in "${kinds[@]}"; do
          kind="${kind//[[:space:]]/}"
          case "$kind" in
            ''|productions|casts) ;;
            *) refuse "kinds can contain productions and casts, not '$kind'." ;;
          esac
        done
        # brom_drake 1.x needs at least 3.14, and Drake publishes wheels up to 3.14.
        if ! [[ "$PYTHON_VERSION" =~ ^3\.14(\.[0-9]+)?$ ]]; then
          refuse "python-version must be 3.14, as brom_drake 1.x requires, not '$PYTHON_VERSION'."
        fi
        if ! [[ "$RUN_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
          refuse "run-timeout-seconds must be a whole number of seconds, not '$RUN_TIMEOUT_SECONDS'."
        fi
        if [ -n "$MAX_CONCURRENCY" ] && ! [[ "$MAX_CONCURRENCY" =~ ^[1-9][0-9]*$ ]]; then
          refuse "max-concurrency must be a positive whole number, not '$MAX_CONCURRENCY'."
        fi
        if ! [[ "$API_URL" =~ ^https?://[^/]+/?$ ]]; then
          refuse "api-url must be the API's base URL, such as https://api.wrenchrobotics.com, not '$API_URL'."
        fi
        exit "$failed"

    - name: Name the results
      id: names
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail
        if [ -z "$NAME" ]; then
          key=saphira
          heading='Saphira Results'
          artifact=saphira-results
        elif [[ "$NAME" == *$'\n'* ]]; then
          echo "::error title=Saphira input::name must be a single line."
          exit 1
        else
          # The same rule as saphirapy.report.normalize_section_key, within the API's pattern.
          key="$(printf '%s' "$NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-//' | cut -c1-48 | sed -E 's/-$//')"
          if [ -z "$key" ]; then
            echo "::error title=Saphira input::name '$NAME' needs at least one letter or digit."
            exit 1
          fi
          heading="Saphira Results ($NAME)"
          artifact="saphira-results-$key"
        fi
        # Outside the checkout, so the files never mix with the caller's own.
        directory="$RUNNER_TEMP/saphira/$key"
        {
          echo "section-key=$key"
          echo "section-heading=$heading"
          echo "artifact-name=$artifact"
          echo "results-directory=$directory/results"
          echo "restaged-directory=$directory/restaged"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      id: install
      shell: bash
      run: |
        set -euo pipefail
        # Install from this action's own checkout so the action works from any repository.
        # saphirapy's own requirements choose the supported brom_drake version.
        pip install "$GITHUB_ACTION_PATH/../../../src/python/saphirapy"
        # github-script steps see another action's path, so they get this one's from here.
        echo "action-path=$GITHUB_ACTION_PATH" >> "$GITHUB_OUTPUT"

    - name: Run Saphira facade
      id: run-facade
      shell: bash
      continue-on-error: true
      env:
        WRENCH_API_KEY: ${{ inputs.api-key }}
        KINDS: ${{ inputs.kinds }}
      run: |
        set -euo pipefail
        args=(
          --path-to-example-run "${{ inputs.path-to-example-run }}"
          --api-url "${{ inputs.api-url }}"
          --fanout-source "${{ inputs.fanout-source }}"
          --run-timeout-seconds "${{ inputs.run-timeout-seconds }}"
          --result-directory "${{ steps.names.outputs.results-directory }}"
          --restaged-output-directory "${{ steps.names.outputs.restaged-directory }}"
        )
        # The key reaches the facade through WRENCH_API_KEY only, never the command line.
        if [ -n "$KINDS" ]; then args+=(--kinds "$KINDS"); fi
        if [ -n "${{ inputs.max-concurrency }}" ]; then args+=(--max-concurrency "${{ inputs.max-concurrency }}"); fi
        saphira-run-facade "${args[@]}"

    - name: Upload facade artifacts
      id: upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.names.outputs.artifact-name }}
        # Each case's brom_drake watcher output (tens of MB of plots) stays out of the artifact.
        path: |
          ${{ steps.names.outputs.results-directory }}
          ${{ steps.names.outputs.restaged-directory }}
          !${{ steps.names.outputs.restaged-directory }}/*/brom

    - name: Collate facade results
      id: collate
      if: always()
      shell: bash
      env:
        RESULTS_DIRECTORIES: ${{ steps.names.outputs.results-directory }}
      run: |
        set -euo pipefail
        summary="$(python "$GITHUB_ACTION_PATH/collate_results.py")"

        {
          echo "summary<<EOF"
          printf '%s\n' "$summary"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        printf '%s\n\n' "$summary" >> "$GITHUB_STEP_SUMMARY"

    # The key reaches saphira-submit through WRENCH_API_KEY only, never the command line. The
    # other values come through the environment too, so nothing is interpolated into the script.
    - name: Submit Saphira report
      id: submit
      if: always()
      shell: bash
      env:
        WRENCH_API_KEY: ${{ inputs.api-key }}
        RESULTS_DIRECTORY: ${{ steps.names.outputs.results-directory }}
        REPORT_MODE: ${{ inputs.report-mode }}
        API_URL: ${{ inputs.api-url }}
        SECTION_KEY: ${{ steps.names.outputs.section-key }}
        SECTION_HEADING: ${{ steps.names.outputs.section-heading }}
        DETECTED_PARENT: ${{ steps.run-facade.outputs.detected-parent }}
        DETECTED_PRODUCTION: ${{ steps.run-facade.outputs.detected-production }}
        FANOUT_SOURCE: ${{ steps.run-facade.outputs.fanout-source }}
        REMOTE_STATUS: ${{ steps.run-facade.outputs.remote-status }}
        FANOUT_REQUEST_ID: ${{ steps.run-facade.outputs.fanout-request-id }}
        ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        ARTIFACT_NAME: ${{ steps.names.outputs.artifact-name }}
      run: |
        set -euo pipefail
        saphira-submit \
          --results-directories "$RESULTS_DIRECTORY" \
          --report-mode "$REPORT_MODE" \
          --api-url "$API_URL" \
          --section-key "$SECTION_KEY" \
          --section-heading "$SECTION_HEADING" \
          --detected-parent "$DETECTED_PARENT" \
          --detected-production "$DETECTED_PRODUCTION" \
          --fanout-source "$FANOUT_SOURCE" \
          --remote-status "$REMOTE_STATUS" \
          --fanout-request-id "$FANOUT_REQUEST_ID" \
          --artifact-id "$ARTIFACT_ID" \
          --artifact-name "$ARTIFACT_NAME"

    - name: Upsert facade PR comment
      if: ${{ always() && github.event_name == 'pull_request' && steps.submit.outputs.workflow-comment == 'true' }}
      # Fork PRs get a read-only token; the results are still in the uploaded artifacts.
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        DETECTED_PARENT: ${{ steps.run-facade.outputs.detected-parent }}
        SECTION_KEY: ${{ steps.names.outputs.section-key }}
        SECTION_HEADING: ${{ steps.names.outputs.section-heading }}
        RESULTS_DIRECTORIES: ${{ steps.names.outputs.results-directory }}
        COMBINED_SUMMARY: ${{ steps.collate.outputs.summary }}
        UPSERT_SCRIPT: ${{ steps.install.outputs.action-path }}/upsert_comment.js
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          await require(process.env.UPSERT_SCRIPT)({ github, context, core });

    - name: Check facade results
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        outcome="${{ steps.run-facade.outcome }}"
        failed_count="${{ steps.run-facade.outputs.failed-count }}"
        timed_out_count="${{ steps.run-facade.outputs.timed-out-count }}"
        result_count="${{ steps.run-facade.outputs.result-count }}"
        if [ -n "$timed_out_count" ] && [ "$timed_out_count" != '0' ]; then
          echo "::notice::${timed_out_count}/${result_count} Saphira fanout cases timed out. Timeouts are reported but do not fail this check."
        fi
        if [ "$outcome" != 'success' ] && [ -z "$failed_count" ]; then
          echo "::error::Saphira facade run did not produce results (fanout crashed before reporting outputs)."
          exit 1
        fi
        if [ -n "$failed_count" ] && [ "$failed_count" != '0' ]; then
          echo "::error::${failed_count}/${result_count} Saphira fanout cases failed. See the uploaded artifacts and the PR comment or Check for details."
          exit 1
        fi